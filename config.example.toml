# data-toolbox-mcp configuration example
#
# See docs/{en,ja}/reference/architecture.md for the full meaning of each field.

[server]
log_level = "info"
log_file  = "~/.data-toolbox/logs/server.log"

# [workspace] has no settings any more (ADR-0011).
#
# workspace_dir is gone: a workspace lives under the work_dir the caller names
# on every call, so what the container writes is somewhere the caller can open.
# allowed_paths is gone with it: load_data reads any file you can read except a
# fixed, in-code blacklist of credential locations (~/.ssh, ~/.aws, …).
# A config still carrying either key fails at startup rather than having it
# silently ignored.

[container]
# Built locally by `data-toolbox-mcp build-runtime` (ADR-0005).
image = "localhost/data-toolbox-runtime:latest"

# If true, the server stops every workspace container on exit.
# If false, containers stay running and are reattached on next ensure.
stop_on_exit = true

[container.limits]
cpu             = "1.0"
memory          = "2GB"
timeout_seconds = 60
# network = "none" (default) blocks outbound traffic from the container.
# Switching to "bridge" (or similar) lets LLM-generated code reach the network,
# including `pip install` — see Phase 0 Q5-4 resolution.
network = "none"

[query]
# Auto LIMIT applied to query_data when the SQL has no LIMIT clause.
default_row_limit = 20000

# attach_files response size caps (ADR-0008). Files larger than max_single
# are downgraded to metadata-only; once cumulative attached bytes reach
# max_total, remaining files are also downgraded.
[attach]
max_single_size_bytes = 10485760   # 10 MiB
max_total_size_bytes  = 20971520   # 20 MiB
